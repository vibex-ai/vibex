[workspace]
members = [
  "apps/desktop",
  "apps/server",
  "apps/relay-server",
  "apps/mobile",
  "crates/app-update",
  "crates/agent",
  "crates/agent-acp",
  "crates/agent-claude",
  "crates/agent-codex",
  "crates/backup",
  "crates/config-switch",
  "crates/content",
  "crates/core",
  "crates/diagnostics",
  "crates/desktop-model",
  "crates/browser",
  "crates/computer",
  "crates/desktop-runtime",
  "crates/db",
  "crates/fs",
  "crates/git",
  "crates/gpui-tokio",
  "crates/relay",
  "crates/remote",
  "crates/terminal",
  "crates/vibex-backend",
  "crates/vibex-remote-client",
  "crates/vibex-ui",
  "crates/vibex-terminal-ui",
  "crates/vibex-tui",
  "apps/tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/vibex-ai/vibex"

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
async-trait = "0.1"
command-group = { version = "5.0.1", features = ["with-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
smallvec = "1"
sha2 = "0.10"
sys-locale = "0.3.2"
sysinfo = "0.37"
# Transcript search is a regex with smart case. It is the same crate the
# filesystem layer already resolves, so the graph gains no new package.
regex = "1"
thiserror = "2"
# `io-std` is what the computer-use helper needs to speak its newline-delimited
# protocol over the process's own standard streams.
tokio = { version = "1", features = ["io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
# Terminal UI stack. `ratatui` drives the character grid; `crossterm` owns the
# terminal backend, raw mode and the event stream. Both are optional-free for
# the TUI binary only, so the GPUI clients never link them.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
# Terminal clients fence the process's standard error while they own the
# screen, and they read the terminal's own clipboard by waiting on its input
# queue. `rustix` is the safe descriptor layer for both, and it is the same
# copy `crossterm` already resolves, so the graph gains no new package.
rustix = { version = "1", features = ["event", "stdio"] }
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-bidi = "0.3"
# The PTY harness drives the real binary through a real pseudo-terminal.
portable-pty = "0.9"
uuid = { version = "1", features = ["serde", "v4", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "ErrorEvent",
  "Event",
  "MessageEvent",
  "Storage",
  "WebSocket",
  "Window",
] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bzip2 = "0.6"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", features = ["sink"] }
futures-channel = "0.3"
reqwest = { version = "0.13.4", features = ["json", "stream", "socks"] }
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
fs2 = "0.4.3"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui_tokio = { package = "gpui-tokio", path = "crates/gpui-tokio" }
gpui-component = "0.7.1"
gpui-fps = "0.7.1"
gpui-kit-assets = "0.7.1"
# The kit's motion layer, which `Plot::hover` implementations sample. Same
# version the component crate already resolves, so the graph keeps one copy.
gpui-base = "0.7.1"
image = { version = "=0.25.10", default-features = false }
tray-icon = { version = "0.24.2", default-features = false }
# The Markdown parser the component text view renders with. The clients read
# their plain-text and resource projections through it, so it stays a direct
# dependency of the shared UI layer.
markdown = { version = "=1.0.0", features = ["serde"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
mdns-sd = { version = "0.21.0", default-features = false }
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html", "serde", "simd"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881", "thread_safe"] }
quick-xml = "=0.41.0"
qrcode = { version = "0.14.1", default-features = false }
resvg = { version = "0.46.0", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
  "raster-images",
] }
hkdf = "0.12"
hmac = "0.12"
ignore = "0.4"
libc = "0.2"
rand_core = "0.6"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = { version = "=2.5.8", features = ["serde"] }
percent-encoding = "2.3"
webpki-root-certs = "1"
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "static_secrets", "zeroize"] }
zip = { version = "=8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
incremental = true

# GPUI, taffy layout, text shaping, and syntax highlighting are all slow when
# built unoptimized, so every dependency stays at a fixed optimization level in
# debug builds while first-party crates keep the fast incremental profile. This
# is the same split Zed uses: it removes most of the input-to-frame latency in
# `cargo run` builds without slowing local rebuilds of our own code.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
