<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https: ws: wss:; img-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'"
    />
    <title>Vibex</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-gate-state="loading">
    <main id="gate-status-layer" role="status" aria-live="polite">
      <div class="status-copy">
        <p class="status-kicker">Vibex</p>
        <h1 id="gate-status-title">Starting WebGPU</h1>
        <p id="gate-status-detail">Checking the mobile runtime before the GPUI canvas starts.</p>
        <code id="gate-status-code">GATE_BOOT</code>
      </div>
    </main>
    <section
      id="pairing-layer"
      class="is-hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="pairing-title"
      aria-describedby="pairing-detail"
    >
      <div class="pairing-sheet" tabindex="-1">
        <header class="pairing-header">
          <p class="pairing-kicker">Vibex Remote</p>
          <h2 id="pairing-title">Pair this device</h2>
          <p id="pairing-detail">Review the Desktop connection before continuing.</p>
        </header>
        <dl id="pairing-preview" class="pairing-preview">
          <div>
            <dt>Desktop</dt>
            <dd id="pairing-desktop">Desktop</dd>
          </div>
          <div>
            <dt>Access</dt>
            <dd id="pairing-permission">Read only</dd>
          </div>
          <div>
            <dt>Entry</dt>
            <dd id="pairing-entry">Secure link</dd>
          </div>
          <div>
            <dt>Expires</dt>
            <dd><time id="pairing-countdown">--:--</time></dd>
          </div>
        </dl>
        <p id="pairing-status" class="pairing-status" aria-live="polite"></p>
        <div class="pairing-actions">
          <button id="pairing-clear" class="pairing-button pairing-button-danger is-hidden" type="button">
            Clear local device
          </button>
          <button id="pairing-scan" class="pairing-button pairing-button-secondary is-hidden" type="button">
            Scan QR
          </button>
          <button id="pairing-cancel" class="pairing-button pairing-button-secondary" type="button">
            Cancel
          </button>
          <button id="pairing-confirm" class="pairing-button pairing-button-primary" type="button">
            Pair device
          </button>
        </div>
      </div>
    </section>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <noscript>Vibex requires JavaScript.</noscript>
    <script type="module" src="./host.js"></script>
  </body>
</html>
