[package]
name = "vibex-desktop"
version = "0.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
e2e-test-support = []

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
qrcode.workspace = true
resvg.workspace = true
pdfium-render.workspace = true
serde.workspace = true
sys-locale.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "3.1.1"
tray-icon.workspace = true
base64.workspace = true
chrono = "0.4.45"
tokio.workspace = true
tracing.workspace = true
url.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
vibex-agent = { path = "../../crates/agent" }
vibex-agent-acp = { path = "../../crates/agent-acp" }
vibex-agent-claude = { path = "../../crates/agent-claude" }
vibex-agent-codex = { path = "../../crates/agent-codex" }
vibex-app-update = { path = "../../crates/app-update" }
vibex-config-switch = { path = "../../crates/config-switch" }
vibex-content = { path = "../../crates/content" }
vibex-core = { path = "../../crates/core" }
vibex-desktop-model = { path = "../../crates/desktop-model" }
vibex-desktop-runtime = { path = "../../crates/desktop-runtime" }
vibex-backend = { path = "../../crates/vibex-backend", features = ["native"] }
vibex-ui = { path = "../../crates/vibex-ui" }
vibex-markdown = { path = "../../crates/vibex-markdown" }
vibex-terminal = { path = "../../crates/terminal" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
tray-icon = { workspace = true, features = ["gtk"] }

[dev-dependencies]
axum.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
vibex-db = { path = "../../crates/db" }
vibex-remote-client = { path = "../../crates/vibex-remote-client" }
vibex-remote = { path = "../../crates/remote" }

[build-dependencies]
embed-resource = "3.0"

[[bin]]
name = "vibex-desktop"
path = "src/main.rs"
