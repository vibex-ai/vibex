name = "vibex-desktop"
productName = "Vibex"
version = "0.1.2"
identifier = "dev.vibex.desktop"
description = "Vibex stable candidate after approved identity transfer"
authors = ["Vibex"]
publisher = "Vibex"
copyright = "Copyright 2026 Vibex"
category = "Developer Tool"
binariesDir = "../../target/release"
outDir = "../../target/release-packages/stable"
icons = [
  "assets/app-icons/icon-16.png",
  "assets/app-icons/icon-24.png",
  "assets/app-icons/icon-32.png",
  "assets/app-icons/icon-48.png",
  "assets/app-icons/icon-64.png",
  "assets/app-icons/icon-128.png",
  "assets/app-icons/icon-256.png",
  "assets/app-icons/icon.png",
  "assets/app-icons/icon.ico",
]
resources = [
  { src = "../../target/native/pdfium/linux-x86_64", target = "pdfium" },
]

[[binaries]]
path = "vibex-desktop"
main = true

# The character-grid client ships alongside the GUI so a shell user never has to
# install anything extra. On macOS and Windows the GUI binary cannot host a
# console (the Windows release entry uses the `windows` subsystem and the macOS
# binary lives inside the `.app`), so this second, non-main binary is the one
# that lands on PATH.
[[binaries]]
path = "vibex"
main = false

[deb]
depends = [
  "libc6",
  "libgcc-s1",
  "libxcb1",
  "libxcb-xkb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libdbus-1-3",
  "libvulkan1",
  "libfontconfig1",
  "libgtk-3-0 | libgtk-3-0t64",
]
section = "devel"

[deb.files]
"packaging/dev.vibex.desktop.desktop" = "/usr/share/applications/dev.vibex.desktop.desktop"
# `vibex-tui` is the explicit name for the character-grid client; the
# launcher forwards to the `vibex` binary shipped beside it.
"packaging/vibex-tui" = "/usr/bin/vibex-tui"

[appimage]
excludedLibs = ["libpdfium.so", "libwayland*"]

[appimage.files]
"packaging/dev.vibex.desktop.desktop" = "/usr/share/applications/dev.vibex.desktop.desktop"
"packaging/vibex-tui" = "/usr/bin/vibex-tui"
