name = "vibex-desktop"
productName = "Vibex RC"
version = "0.1.0-rc.1"
identifier = "dev.vibex.desktop.rc"
description = "Vibex opt-in release candidate"
authors = ["Vibex"]
publisher = "Vibex"
copyright = "Copyright 2026 Vibex"
binariesDir = "../../target/release"
outDir = "../../target/release-packages/rc"
icons = [
  "assets/app-icons/icon-16.png",
  "assets/app-icons/icon-24.png",
  "assets/app-icons/icon-32.png",
  "assets/app-icons/icon-48.png",
  "assets/app-icons/icon-64.png",
  "assets/app-icons/icon-128.png",
  "assets/app-icons/icon-256.png",
  "assets/app-icons/icon.png",
  "assets/app-icons/icon.ico",
]
resources = [
  { src = "../../target/native/pdfium/linux-x86_64", target = "pdfium" },
]

[[binaries]]
path = "vibex-desktop"
main = true

[deb]
depends = [
  "libc6",
  "libgcc-s1",
  "libxcb1",
  "libxcb-xkb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libdbus-1-3",
  "libvulkan1",
  "libfontconfig1",
  "libayatana-appindicator3-1 | libappindicator3-1",
]
section = "devel"
files = { "packaging/dev.vibex.desktop.rc.desktop" = "/usr/share/applications/dev.vibex.desktop.rc.desktop" }

[appimage]
excludedLibs = ["libpdfium.so"]
files = { "packaging/dev.vibex.desktop.rc.desktop" = "/usr/share/applications/dev.vibex.desktop.rc.desktop" }
