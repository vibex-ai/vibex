name = "vibex-desktop"
productName = "Vibex Preview"
version = "0.1.0-rc.10"
identifier = "dev.vibex.desktop.preview"
description = "Production-shaped desktop preview package"
authors = ["Vibex"]
publisher = "Vibex"
copyright = "Copyright 2026 Vibex"
category = "Developer Tool"
binariesDir = "../../target/release"
outDir = "../../target/hosted-packages"
icons = [
  "assets/app-icons/icon-16.png",
  "assets/app-icons/icon-24.png",
  "assets/app-icons/icon-32.png",
  "assets/app-icons/icon-48.png",
  "assets/app-icons/icon-64.png",
  "assets/app-icons/icon-128.png",
  "assets/app-icons/icon-256.png",
  "assets/app-icons/icon.png",
  "assets/app-icons/icon.ico",
]
# Windows resolves a second command name from a `.cmd` beside the binary, which
# is what makes `vibex-tui` work in a shell there. macOS packaging strips this
# entry: a `.cmd` has no meaning inside an app bundle.
resources = [
  { src = "packaging/vibex-tui.cmd", target = "vibex-tui.cmd" },
]

[[binaries]]
path = "vibex-desktop"
main = true

# The character-grid client ships alongside the GUI so a shell user never has to
# install anything extra. On macOS and Windows the GUI binary cannot host a
# console (the Windows release entry uses the `windows` subsystem and the macOS
# binary lives inside the `.app`), so this second, non-main binary is the one
# that lands on PATH.
[[binaries]]
path = "vibex"
main = false

[deb]
depends = [
  "libc6",
  "libgcc-s1",
  "libxcb1",
  "libxcb-xkb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libdbus-1-3",
  "libvulkan1",
  "libfontconfig1",
  "libgtk-3-0 | libgtk-3-0t64",
]
section = "devel"
files = { "packaging/dev.vibex.desktop.preview.desktop" = "/usr/share/applications/dev.vibex.desktop.preview.desktop" }

[nsis]
installMode = "currentUser"
compression = "zlib"
# The vendored template adds the install directory to the user PATH on install
# and removes it on uninstall; see the header comment in the file for the two
# differences from cargo-packager's own template.
template = "packaging/nsis/installer.nsi"
