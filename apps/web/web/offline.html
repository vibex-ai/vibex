<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Vibex is offline</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-gate-state="offline">
    <main id="gate-status-layer" role="status" aria-live="polite">
      <div class="status-copy">
        <p class="status-kicker">Vibex</p>
        <h1>Offline</h1>
        <p id="gate-status-detail">Reconnect to the network, then reopen Vibex. Cached application assets remain available.</p>
        <code id="gate-status-code">REMOTE_OFFLINE</code>
      </div>
    </main>
  </body>
</html>
