[package]
name = "vibex-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vibex-agent = { path = "../../crates/agent" }
vibex-browser = { path = "../../crates/browser" }
vibex-computer = { path = "../../crates/computer" }
vibex-core = { path = "../../crates/core" }
vibex-db = { path = "../../crates/db" }
vibex-desktop-runtime = { path = "../../crates/desktop-runtime", default-features = false }
vibex-remote = { path = "../../crates/remote" }
vibex-client = { path = "../tui", default-features = false }
vibex-tui = { path = "../../crates/vibex-tui" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[[bin]]
name = "vibex-server"
path = "src/main.rs"
