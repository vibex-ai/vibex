[package]
name = "vibex-client"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone character-grid client for a Vibex runtime"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vibex-backend = { path = "../../crates/vibex-backend", features = ["native"] }
vibex-computer = { path = "../../crates/computer" }
vibex-core = { path = "../../crates/core" }
vibex-db = { path = "../../crates/db" }
vibex-desktop-runtime = { path = "../../crates/desktop-runtime" }
vibex-remote = { path = "../../crates/remote" }
vibex-remote-client = { path = "../../crates/vibex-remote-client" }
vibex-tui = { path = "../../crates/vibex-tui" }
vibex-ui = { path = "../../crates/vibex-ui", default-features = false }

[lib]
name = "vibex_client"
path = "src/lib.rs"

[[bin]]
name = "vibex"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
