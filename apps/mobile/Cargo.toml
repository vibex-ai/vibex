[package]
name = "vibex-mobile"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibex_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Fetching a provider's generated image is a plain GET, which is cheaper than
# teaching the whole UI toolkit an HTTP client it does not otherwise need.
reqwest.workspace = true
base64.workspace = true
chrono = "0.4.45"
futures-channel.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
# The grammars the file viewer highlights with. The list is the desktop's own,
# so a file opened on a phone is colored by the same grammar the desktop editor
# parses it with; a language this build does not carry renders as plain text
# rather than as a guess.
gpui-component = { workspace = true, features = [
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-csharp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-kotlin",
  "tree-sitter-lua",
  "tree-sitter-markdown",
  "tree-sitter-php",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
  "tree-sitter-zig",
] }
gpui-base.workspace = true
gpui-kit-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
unicode-segmentation = "1"
url.workspace = true
tokio.workspace = true
vibex-app-update = { path = "../../crates/app-update" }
vibex-backend = { path = "../../crates/vibex-backend" }
vibex-core = { path = "../../crates/core" }
vibex-desktop-model = { path = "../../crates/desktop-model" }
vibex-remote-client = { path = "../../crates/vibex-remote-client" }
vibex-terminal-ui = { path = "../../crates/vibex-terminal-ui" }
vibex-ui = { path = "../../crates/vibex-ui" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# `gpui-pre-mobile` must build against the same `gpui-pre` that gpui-kit 0.9.1
# pins (`=0.3.12`), and Cargo cannot hold two exact pins in the same 0.3 range.
# Upstream's latest revision (`7548ebc`) still pins `=0.3.10`, so this names
# `PeatBoy/gpui-mobile` at `d8945a8`: upstream plus the version bump, the
# re-vendored 0.3.12 `gpui-pre-wgpu`, and the `WgpuContext::new` call sites the
# renderer API moved. That branch is proposed upstream as
# longbridge/gpui-mobile#56. The pin names a revision rather than a branch so its
# contents stay fixed.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/PeatBoy/gpui-mobile", rev = "d8945a826e4012b43a46b53d7e72b6beae24cc80" }

[target.'cfg(target_os = "android")'.dependencies]
# `gpui-pre-mobile` links `android-activity`'s NativeActivity glue into the
# library, and that glue references `android_main`; this dependency carries the
# `AndroidApp` type of the inert stub that keeps the symbol defined. The
# `native-activity` feature itself stays enabled by `gpui-pre-mobile`.
android-activity = "0.6"
jni = "0.22"
# The host entry reports through the `log` facade, which is what the platform
# logger installed by `install_diagnostics` is wired to.
log = "0.4"
# The host entry hands GPUI the `ANativeWindow` behind each Android `Surface`.
ndk = { version = "0.9", features = ["nativewindow"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The kit's touch-selection menu is queried through its observation registry
# (`gpui_base::test_support`), which its own feature turns on in both the kit
# and the base it wraps.
gpui-component = { workspace = true, features = ["test-support"] }
# Update fixtures describe the same semver releases the desktop updater reads.
semver.workspace = true
tempfile = "3"
