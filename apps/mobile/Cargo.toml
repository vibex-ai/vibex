[package]
name = "vibex-mobile"
version = "0.1.0-rc.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibex_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64.workspace = true
chrono = "0.4.45"
futures-channel.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
unicode-segmentation = "1"
url.workspace = true
tokio.workspace = true
vibex-backend = { path = "../../crates/vibex-backend" }
vibex-core = { path = "../../crates/core" }
vibex-desktop-model = { path = "../../crates/desktop-model" }
vibex-markdown = { path = "../../crates/vibex-markdown", default-features = false }
vibex-remote-client = { path = "../../crates/vibex-remote-client" }
vibex-terminal-ui = { path = "../../crates/vibex-terminal-ui" }
vibex-ui = { path = "../../crates/vibex-ui" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "f70603903854751a5589242d4eadcd031823a75a" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
