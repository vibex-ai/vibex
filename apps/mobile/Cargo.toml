[package]
name = "vibex-mobile"
version = "0.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vibex_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
futures-channel.workspace = true
futures-util.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
url.workspace = true
vibex-backend = { path = "../../crates/vibex-backend" }
vibex-core = { path = "../../crates/core" }
vibex-desktop-model = { path = "../../crates/desktop-model" }
vibex-markdown = { path = "../../crates/vibex-markdown", default-features = false }
vibex-remote-client = { path = "../../crates/vibex-remote-client" }
vibex-ui = { path = "../../crates/vibex-ui" }

[target.'cfg(target_os = "android")'.dependencies]
gpui_android = { path = "../../vendor/zed/crates/gpui_android" }
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"
