name: Vibex
options:
  minimumXcodeGenVersion: "2.45.0"
  projectFormat: xcode15_3
  bundleIdPrefix: ai.vibex
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vibex:
    type: application
    platform: iOS
    sources:
      - path: Vibex
    dependencies:
      - framework: VibexFFI.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      # The pairing scanner decodes a QR code out of an image the user picks
      # from the photo library.
      - sdk: Vision.framework
      # gpui-pre-mobile's package modules declare these frameworks with
      # `#[link(name = ...)]`, so the binary has to link them even though Vibex
      # only uses the platform layer.
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: AppTrackingTransparency.framework
      - sdk: Contacts.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: EventKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: Speech.framework
      - sdk: StoreKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.vibex.mobile
        PRODUCT_NAME: Vibex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vibex
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code shown in Vibex desktop to pair this device.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Discover Vibex desktops available for pairing on your local network.
        INFOPLIST_KEY_NSBonjourServices: ["_vibex._tcp"]
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Usage strings for the gpui-pre-mobile package modules that are linked
        # in but not part of any Vibex flow yet. They keep App Review from
        # rejecting a binary that references the frameworks.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio when a paired Vibex session requests it.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach images from your library to a Vibex session.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save images shared by a Vibex session to your library.
        INFOPLIST_KEY_NSContactsUsageDescription: Share a contact when a paired Vibex session requests one.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Share a calendar event when a paired Vibex session requests one.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to nearby Vibex devices over Bluetooth.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictate prompts to a Vibex session.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Tag a Vibex session with your current location.
        INFOPLIST_KEY_NSMotionUsageDescription: Read device motion for gesture input.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: Measure Vibex feature usage across apps and websites.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock paired Vibex credentials with Face ID.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Attach media from your library to a Vibex session.
        CLANG_ENABLE_OBJC_ARC: YES
        # The XCFramework supplies the header and its sole VibexFFI module map
        # through Xcode's generated target include directory.
        # The FFI library is only built for arm64 simulators.
        ARCHS: [arm64]
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-all_load"]
