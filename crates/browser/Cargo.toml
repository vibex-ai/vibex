[package]
name = "vibex-browser"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Reading a real Chromium-family profile's login state. Desktop and server
# builds enable it through `vibex-desktop-runtime`; the mobile client does not,
# because the feature drags SQLite's bundled C library and a LevelDB reader
# into a build that has no browser panel to import into.
profile-import = ["dep:rusqlite", "dep:rusty-leveldb"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
command-group.workspace = true
futures-util.workspace = true
reqwest.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
# The source profile's cookie store is SQLite; this is the same bundled engine
# the rest of the workspace already links.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
# The source profile's localStorage is a LevelDB store whose blocks are
# Snappy-compressed.
rusty-leveldb = { version = "4.0.1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
vibex-core = { path = "../core" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
