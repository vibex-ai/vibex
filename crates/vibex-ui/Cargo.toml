[package]
name = "vibex-ui"
version = "0.1.0-rc.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gpui-component"]
# Bridges the shared semantic catalog onto gpui-component's global theme. On by
# default so both GPUI clients compile the same mapping; the catalog, file
# loader, and projection modules stay platform neutral either way.
gpui-component = ["dep:gpui", "dep:gpui-component"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
vibex-core = { path = "../core" }
vibex-desktop-model = { path = "../desktop-model" }
vibex-backend = { path = "../vibex-backend" }
vibex-terminal-ui = { path = "../vibex-terminal-ui" }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
vibex-git = { path = "../git" }
