[package]
name = "vibex-desktop-runtime"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Turns on the OS keychain backend in vibex-config-switch. Desktop and TUI
# builds enable it; the headless server leaves it off so the artifact does not
# link libdbus or the platform secret-service stack.
os-keychain = ["vibex-config-switch/os-keychain"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bzip2.workspace = true
chrono = "0.4.45"
vibex-backup = { path = "../backup" }
fs2 = "0.4"
flate2 = "1"
futures-util.workspace = true
mdns-sd.workspace = true
reqwest.workspace = true
rustls.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
semver.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tar = "0.4"
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
vibex-app-update = { path = "../app-update" }
vibex-agent = { path = "../agent" }
vibex-agent-acp = { path = "../agent-acp" }
vibex-browser = { path = "../browser", features = ["profile-import"] }
vibex-computer = { path = "../computer" }
vibex-config-switch = { path = "../config-switch", default-features = false }
vibex-core = { path = "../core" }
vibex-db = { path = "../db" }
vibex-desktop-model = { path = "../desktop-model" }
vibex-diagnostics = { path = "../diagnostics" }
vibex-fs = { path = "../fs" }
vibex-git = { path = "../git" }
vibex-model-catalog = { path = "../model-catalog" }
vibex-model-gateway = { path = "../model-gateway" }
vibex-relay = { path = "../relay" }
vibex-remote = { path = "../remote" }
vibex-terminal = { path = "../terminal" }
vibex-terminal-ui = { path = "../vibex-terminal-ui" }
webpki-root-certs.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vibex-home-lock-probe"
path = "src/bin/vibex-home-lock-probe.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
