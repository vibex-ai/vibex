[package]
name = "vibex-tui"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Character-grid client for the Vibex DesktopRuntime"

# The dependency boundary is a hard architectural rule: this crate is a
# *client*. It consumes the `vibex-backend` domain traits and never starts,
# owns, or reaches past the runtime. Keeping GPUI, the database, the browser
# runtime and the PDF/Office content stack out of the manifest is what makes
# the TUI linkable without a window server.
[dependencies]
# The clock beside a message is the reader's own wall clock, so a local
# timezone has to be resolved rather than a UTC hour printed. `clock` is the
# only feature this needs: the crate formats an hour and a minute, never a date,
# and the terminal is never the wasm target.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm.workspace = true
# The user's home directory, resolved the way the platform means it: `HOME` on
# Unix, the known-folder API on Windows. Reading `HOME` directly is what left
# the client unable to find a home on a stock Windows shell, where the desktop
# app resolves one through this same crate. It is already in the graph, so this
# adds no package.
dirs = "6"
# Markdown is parsed in-crate (`src/markdown/`) so the terminal client owns its
# own document model instead of depending on the desktop Markdown crate.
html5ever.workspace = true
# A pasted screenshot is previewed as a half-block raster, which is the one
# thing in this client that has to look inside a picture. The decoder is a leaf
# dependency with no window server in it, so the crate stays linkable wherever
# a terminal is; the formats are the ones a clipboard and a file paste can
# carry, and the same set the attach path already accepts.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "webp"] }
markup5ever_rcdom.workspace = true
pulldown-cmark.workspace = true
qrcode.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sys-locale.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
vibex-backend = { path = "../vibex-backend" }
# The Agent and model brand marks, and the rasterizer that turns a mark into the
# PNG a terminal's image protocol takes. Shared with the desktop and the phone so
# the same Agent wears the same mark everywhere; the identity table itself is
# what the mark columns are drawn from.
vibex-brands = { path = "../vibex-brands", features = ["raster"] }
vibex-core = { path = "../core" }
vibex-desktop-model = { path = "../desktop-model" }
vibex-terminal-ui = { path = "../vibex-terminal-ui" }
vibex-ui = { path = "../vibex-ui", default-features = false }

# The `stderr` diversion is a POSIX descriptor operation.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# Builds the harness binary the PTY tests drive. Off by default so a normal
# build does not ship a second entry point.
pty-harness = []

[dev-dependencies]
anyhow.workspace = true
crossterm.workspace = true
# The render tests encode a real PNG fixture: a preview of pixels has to be
# asserted against pixels, not against a hand-written byte string.
image = { workspace = true, features = ["png"] }
portable-pty.workspace = true
ratatui.workspace = true
tempfile = "3"
vibex-git = { path = "../git" }

[[bin]]
name = "vibex-tui-harness"
path = "src/bin/harness.rs"
required-features = ["pty-harness"]
