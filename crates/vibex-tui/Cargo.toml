[package]
name = "vibex-tui"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Character-grid client for the Vibex DesktopRuntime"

# The dependency boundary is a hard architectural rule: this crate is a
# *client*. It consumes the `vibex-backend` domain traits and never starts,
# owns, or reaches past the runtime. Keeping GPUI, the database, the browser
# runtime and the PDF/Office content stack out of the manifest is what makes
# the TUI linkable without a window server.
[dependencies]
# The clock beside a message is the reader's own wall clock, so a local
# timezone has to be resolved rather than a UTC hour printed. `clock` is the
# only feature this needs: the crate formats an hour and a minute, never a date,
# and the terminal is never the wasm target.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm.workspace = true
qrcode.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vibex-backend = { path = "../vibex-backend" }
vibex-core = { path = "../core" }
vibex-desktop-model = { path = "../desktop-model" }
vibex-markdown = { path = "../vibex-markdown", default-features = false }
vibex-terminal-ui = { path = "../vibex-terminal-ui" }
vibex-ui = { path = "../vibex-ui", default-features = false }

# The `stderr` diversion is a POSIX descriptor operation.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# Builds the harness binary the PTY tests drive. Off by default so a normal
# build does not ship a second entry point.
pty-harness = []

[dev-dependencies]
anyhow.workspace = true
crossterm.workspace = true
portable-pty.workspace = true
ratatui.workspace = true
tempfile = "3"
vibex-git = { path = "../git" }

[[bin]]
name = "vibex-tui-harness"
path = "src/bin/harness.rs"
required-features = ["pty-harness"]
