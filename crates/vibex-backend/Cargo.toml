[package]
name = "vibex-backend"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:tokio", "dep:vibex-desktop-runtime", "dep:vibex-desktop-model"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
vibex-browser = { path = "../browser" }
vibex-core = { path = "../core" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, optional = true }
vibex-desktop-runtime = { path = "../desktop-runtime", optional = true }
vibex-desktop-model = { path = "../desktop-model", optional = true }

[dev-dependencies]
serde_json.workspace = true
