name: Stage 0 Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  default-check:
    name: Default check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            g++ \
            gcc \
            pkg-config \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            patchelf
      - name: Verify Rust workspace manifest
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run default checks
        run: pnpm check

  browser-smoke:
    name: Embedded browser smoke (${{ matrix.os }})
    # Windows is the only platform whose CDP transport is the loopback debugging
    # port rather than the pipe, so the smoke runs there as well as on Linux.
    # The suite skips only on a machine with no browser at all; any other failure
    # is a real one — a broken transport used to be skipped as "no browser",
    # which is how the Windows panel shipped unable to open a tab.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ gcc pkg-config libssl-dev
      - name: Run the embedded browser smoke
        run: cargo test -p vibex-browser --locked --test page_tabs --test panel_tools -- --nocapture

  smoke-placeholders:
    name: Scripted smoke entrypoints
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Stage 0 smoke commands are explicit local entrypoints:"
          echo "pnpm smoke:db"
          echo "pnpm smoke:git"
          echo "pnpm smoke:browser"
          echo "pnpm smoke:pty"
          echo "pnpm smoke:codex"
          echo "pnpm smoke:claude"
          echo "Real Agent smoke requires local CLI auth and is not part of the default CI job."
