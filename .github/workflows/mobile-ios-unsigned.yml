name: Mobile iOS Unsigned IPA

# Builds the unsigned device IPA on demand so a build can be produced without
# cutting a release tag. Producing it needs no Apple account, certificate, or
# provisioning profile; whoever installs it re-signs it with their own Apple ID.
# See docs/operations/ios-unsigned-install.md.
#
# `workflow_dispatch` only lists the workflow once this file is on the default
# branch, so run it from there after merging.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to stamp into the build (defaults to the mobile crate version)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  ios-unsigned-ipa:
    name: Unsigned iOS IPA
    # macOS 14 images no longer exist; macOS 15 ships the Xcode 16 SDK.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: Verify native mobile contract
        run: node scripts/check-mobile-native.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS XCFramework
        env:
          VIBEX_MOBILE_PROFILE: release
        run: bash apps/mobile/scripts/build-ios.sh
      - name: Package unsigned device IPA
        env:
          # An empty value makes the script fall back to the mobile crate version.
          VIBEX_MOBILE_VERSION: ${{ inputs.version }}
        run: bash apps/mobile/scripts/package-ios-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ios-unsigned-${{ github.sha }}
          path: target/mobile-ios-artifacts/**
          if-no-files-found: error
          retention-days: 14
